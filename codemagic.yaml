workflows:
  ios-testflight:
    name: iOS — build + TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Sin 'integrations:' a proposito. Las integraciones con nombre son feature
    # de cuentas Team; en Individual no resuelven. Las credenciales viajan como
    # variables del grupo app_store_credentials, que funciona en cualquier tier:
    #   APP_STORE_CONNECT_ISSUER_ID
    #   APP_STORE_CONNECT_KEY_IDENTIFIER
    #   APP_STORE_CONNECT_PRIVATE_KEY   (contenido del .p8, marcado como secreto)
    #   APP_STORE_APPLE_ID
    # La CLI de Codemagic lee las tres primeras del entorno automaticamente.
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "co.padelking.app"
      node: 22
      xcode: latest
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-v*'
          include: true
    scripts:
      - name: pnpm install
        script: |
          npm install -g pnpm@10
          pnpm install --frozen-lockfile
      - name: cap sync ios
        script: |
          cd apps/web
          pnpm exec cap sync ios
      - name: Set up provisioning + signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Bump build number
        script: |
          cd apps/web/ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build IPA
        script: |
          cd apps/web/ios/App
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - apps/web/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        # Sin beta_groups: el grupo tiene que existir ya en TestFlight y la app
        # se acaba de crear. La build queda disponible para testers internos.

  ios-pr-validate:
    name: iOS — PR build validation (sin firmar)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      xcode: latest
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: false
    scripts:
      - name: pnpm install
        script: |
          npm install -g pnpm@10
          pnpm install --frozen-lockfile
      - name: cap sync ios
        script: |
          cd apps/web
          pnpm exec cap sync ios
      - name: Build sin firmar (validación)
        script: |
          cd apps/web/ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build
